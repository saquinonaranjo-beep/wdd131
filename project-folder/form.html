<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Product Review Form</h1>
    <form method="get" action="review.html">
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a product ...</option>
        </select>

    </form>

    <p>Overall Rating:</p>
        <label><input type="radio" name="rating" value="1" required> 1 ⭐</label>
        <label><input type="radio" name="rating" value="2"> 2 ⭐</label>
        <label><input type="radio" name="rating" value="3"> 3 ⭐</label>
        <label><input type="radio" name="rating" value="4"> 4 ⭐</label>
        <label><input type="radio" name="rating" value="5"> 5 ⭐</label>

        <label for="date">Date of Installation:</label>
        <input type="date" id="date" name="date" required>

    <p>Useful Features:</p>
        <label><input type="checkbox" name="features" value="easy"> Easy to Use</label>
        <label><input type="checkbox" name="features" value="design"> Good Design</label>
        <label><input type="checkbox" name="features" value="fast"> Fast Performance</label>

        <label for="review">Written Review:</label>
        <textarea id="review" name="review"></textarea>

        <label for="username">Your Name:</label>
        <input type="text" id="username" name="username">
        <input type="submit" value="Submit Review">

    <script src="js/script.js"></script>
    <footer>
        <p>&copy; 2024 Sergio Aquino. All rights reserved.</p>
    </footer>
</body>
</html>
